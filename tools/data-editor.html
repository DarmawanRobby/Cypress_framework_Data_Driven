<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Data Editor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>📝</text></svg>"
    />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --txt: #e6e9ef;
        --muted: #8b93a7;
        --accent: #4f9cf9;
        --danger: #f9594f;
        --ok: #4fd07a;
      }
      * {
        box-sizing: border-box;
      }
      /* Native `hidden` must always win, regardless of any ID/class display rule below. */
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: var(--bg);
        color: var(--txt);
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px;
        overflow: auto;
      }
      aside h1 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
        margin: 0 0 12px;
      }
      #tree {
        margin-bottom: 16px;
      }
      .tree-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 6px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--txt);
        transition: background-color 0.1s;
      }
      .tree-row:hover {
        background: #1f2430;
      }
      .tree-row.file.active {
        background: var(--accent);
        color: #fff;
      }
      .tree-row.file.active .icon {
        filter: brightness(0) invert(1);
      }
      .tree-row.folder .folder-label {
        color: var(--muted);
        font-weight: 600;
      }
      .tree-row .toggle {
        width: 14px;
        flex: none;
        text-align: center;
        color: var(--muted);
        font-size: 11px;
      }
      .tree-row .icon {
        flex: none;
        font-size: 12px;
        opacity: 0.85;
      }
      .tree-row .label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .icon-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        flex: none;
        transition:
          color 0.1s,
          background-color 0.1s;
      }
      .icon-btn:hover {
        color: var(--txt);
        background: #262c3a;
      }
      .icon-btn.danger:hover {
        color: var(--danger);
      }
      #contextMenu {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px;
        min-width: 170px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        z-index: 30;
      }
      #contextMenu button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        padding: 8px 10px;
        border-radius: 6px;
      }
      #contextMenu button:hover {
        background: #262c3a;
        border-color: transparent;
      }
      #contextMenu button.danger {
        color: var(--danger);
      }
      main {
        padding: 20px 24px;
        overflow: auto;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 16px;
        margin-bottom: 16px;
      }
      h2 {
        margin: 0;
        font-size: 18px;
        min-width: 0;
        flex: 1 1 auto;
        overflow-wrap: anywhere;
      }
      h2 .seg-dir {
        color: var(--muted);
        font-weight: 400;
      }
      h2 .seg-sep {
        color: var(--muted);
        margin: 0 2px;
        font-weight: 400;
      }
      button {
        background: #222836;
        color: var(--txt);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
        font: inherit;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        color: var(--danger);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      input[type='text'],
      input[type='number'],
      select {
        background: #0c0e12;
        border: 1px solid var(--line);
        color: var(--txt);
        border-radius: 5px;
        padding: 6px 8px;
        font: inherit;
        width: 100%;
        transition: border-color 0.15s;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 4px 6px;
        text-align: left;
      }
      th {
        background: #1c212c;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .filter-row td {
        background: #14171f;
        padding: 3px 4px;
      }
      .filter-row input,
      .filter-row select {
        padding: 3px 5px;
        font-size: 12px;
      }
      tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.025);
      }
      tbody tr:hover {
        background: rgba(79, 156, 249, 0.08);
      }
      td.center {
        text-align: center;
      }
      .muted {
        color: var(--muted);
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 8px;
      }
      form input {
        flex: 1 1 120px;
        width: auto;
        min-width: 0;
      }
      #toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      #toast.ok {
        background: var(--ok);
        color: #06210f;
      }
      #toast.err {
        background: var(--danger);
        color: #2a0606;
      }
      #modalOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      #modalBox {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        width: min(440px, 90vw);
      }
      #modalMsg {
        margin: 0 0 14px;
        white-space: pre-wrap;
      }
      #modalInput {
        margin-bottom: 16px;
      }
      #modalButtons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .th-inner {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dd-btn {
        margin-left: auto;
      }
      .dd-btn.active {
        color: var(--accent);
      }
      #ddOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 25;
      }
      #ddBox {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
        width: min(460px, 92vw);
        max-height: 82vh;
        display: flex;
        flex-direction: column;
      }
      #ddBox h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      #ddHint {
        margin: 0 0 12px;
        font-size: 12px;
      }
      #ddList {
        overflow: auto;
        margin-bottom: 12px;
      }
      .dd-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      #ddAddForm {
        margin-bottom: 14px;
      }
      #ddButtons {
        display: flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>Data Files</h1>
      <input id="fileSearch" type="text" placeholder="Search files…" style="margin-bottom: 10px" />
      <div id="tree"></div>
      <form id="newFileForm">
        <input id="newFileName" type="text" placeholder="new-file or dir/new-file" />
        <button class="primary" type="submit">+ File</button>
      </form>
      <form id="newFolderForm">
        <input id="newFolderName" type="text" placeholder="new-folder or dir/sub" />
        <button type="submit">+ Folder</button>
      </form>
    </aside>

    <main>
      <header>
        <h2 id="current">Select a file →</h2>
        <div class="row">
          <button id="saveBtn" class="primary" disabled>Save</button>
          <button id="renameFileBtn" disabled>Rename / Move</button>
          <button id="delFileBtn" class="danger" disabled>Delete file</button>
        </div>
      </header>

      <div id="toolbar" hidden>
        <button id="addRowBtn">+ Row</button>
        <form id="addFieldForm">
          <input id="addFieldName" type="text" placeholder="new field" />
          <button type="submit">+ Field</button>
        </form>
        <input
          id="rowSearch"
          type="text"
          placeholder="Search rows…"
          style="flex: 1; max-width: 260px"
        />
      </div>

      <div id="tableWrap"><p class="muted">👈 Pick a file on the left to edit it.</p></div>
    </main>

    <div id="toast"></div>

    <div id="modalOverlay" hidden>
      <div id="modalBox">
        <p id="modalMsg"></p>
        <input id="modalInput" type="text" />
        <div id="modalButtons">
          <button id="modalCancel">Cancel</button>
          <button id="modalOk" class="primary">OK</button>
        </div>
      </div>
    </div>

    <div id="contextMenu" hidden></div>

    <div id="ddOverlay" hidden>
      <div id="ddBox">
        <h3 id="ddTitle"></h3>
        <p id="ddHint" class="muted">
          Cells in this column become a dropdown of these options. Existing values not in the list
          are kept and marked with (?).
        </p>
        <div id="ddList"></div>
        <form id="ddAddForm">
          <input id="ddAddInput" type="text" placeholder="new option" />
          <button class="primary" type="submit">+ Option</button>
        </form>
        <div id="ddButtons">
          <button id="ddRemove" class="danger">Remove dropdown</button>
          <span style="flex: 1"></span>
          <button id="ddCancel">Cancel</button>
          <button id="ddSave" class="primary">Save</button>
        </div>
      </div>
    </div>

    <script>
      let file = null
      let records = []
      let columns = []
      let types = {}
      let columnFilters = {} // { colName: filter value ('' means no filter) }
      let dropdowns = {} // { colName: [option, ...] } — cells in that column render as <select>
      let allFolders = []
      let allFiles = []
      const expanded = new Set()

      const $ = (id) => document.getElementById(id)
      const api = (path, opt) =>
        fetch(path, opt).then((r) =>
          r.ok ? r.json() : r.json().then((e) => Promise.reject(new Error(e.error || r.status))),
        )

      let toastTimer = null
      function toast(msg, ok = true) {
        const t = $('toast')
        t.textContent = msg
        t.className = 'show ' + (ok ? 'ok' : 'err')
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => (t.className = ''), 2400)
      }

      // Native window.prompt()/confirm() are blocked or silently no-op in some browser
      // contexts (embedded webviews, sandboxed iframes). This in-page modal replaces both
      // so rename/move/delete confirmations always work.
      function showModal(message, { withInput = false, defaultValue = '' } = {}) {
        return new Promise((resolve) => {
          const overlay = $('modalOverlay')
          const input = $('modalInput')
          $('modalMsg').textContent = message
          input.hidden = !withInput
          input.value = defaultValue
          overlay.hidden = false
          if (withInput) {
            input.focus()
            input.select()
          } else {
            $('modalOk').focus()
          }

          const finish = (result) => {
            overlay.hidden = true
            overlay.onclick = null
            overlay.onkeydown = null
            input.onkeydown = null
            $('modalOk').onclick = null
            $('modalCancel').onclick = null
            resolve(result)
          }
          const submit = () => finish(withInput ? input.value : true)
          const cancel = () => finish(withInput ? null : false)

          $('modalOk').onclick = submit
          $('modalCancel').onclick = cancel
          overlay.onclick = (e) => {
            if (e.target === overlay) cancel()
          }
          // Escape must work for both variants; Enter only needs custom handling on the
          // input (a plain <input> outside a <form> has no native submit-on-Enter). A
          // focused button already triggers its own click on Enter, so no handler needed there.
          overlay.onkeydown = (e) => {
            if (e.key === 'Escape') cancel()
          }
          input.onkeydown = (e) => {
            if (e.key === 'Enter') submit()
          }
        })
      }

      const showPrompt = (message, defaultValue = '') =>
        showModal(message, { withInput: true, defaultValue })
      const showConfirm = (message) => showModal(message)

      let closeMenuOnDocClick = null
      let closeMenuOnKeydown = null
      function closeContextMenu() {
        const menu = $('contextMenu')
        menu.hidden = true
        if (closeMenuOnDocClick) document.removeEventListener('click', closeMenuOnDocClick)
        if (closeMenuOnKeydown) document.removeEventListener('keydown', closeMenuOnKeydown)
        closeMenuOnDocClick = null
        closeMenuOnKeydown = null
      }

      // items: [{ label, danger, onClick }]
      function openContextMenu(anchorEl, items) {
        closeContextMenu()
        const menu = $('contextMenu')
        menu.innerHTML = ''
        items.forEach(({ label, danger, onClick }) => {
          const btn = document.createElement('button')
          btn.textContent = label
          if (danger) btn.className = 'danger'
          btn.onclick = () => {
            closeContextMenu()
            onClick()
          }
          menu.appendChild(btn)
        })
        const rect = anchorEl.getBoundingClientRect()
        const menuWidth = 170
        const left = Math.max(8, Math.min(rect.left, window.innerWidth - menuWidth - 8))
        menu.style.left = left + 'px'
        menu.style.top = rect.bottom + 4 + 'px'
        menu.hidden = false

        closeMenuOnDocClick = (e) => {
          if (!menu.contains(e.target)) closeContextMenu()
        }
        closeMenuOnKeydown = (e) => {
          if (e.key === 'Escape') closeContextMenu()
        }
        // Deferred so the click that opened the menu doesn't immediately close it.
        setTimeout(() => document.addEventListener('click', closeMenuOnDocClick), 0)
        document.addEventListener('keydown', closeMenuOnKeydown)
      }

      async function loadFiles() {
        const tree = await api('/api/tree')
        allFolders = tree.folders
        allFiles = tree.files
        renderTree()
      }

      // Groups folders/files by their parent path ('' = root) for tree rendering.
      function buildChildren() {
        const children = { '': { folders: [], files: [] } }
        const ensure = (p) => (children[p] ??= { folders: [], files: [] })
        allFolders.forEach((f) => {
          const parent = f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : ''
          ensure(parent).folders.push(f)
          ensure(f)
        })
        allFiles.forEach((f) => {
          const parent = f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : ''
          ensure(parent).files.push(f)
        })
        return children
      }

      function renderTree() {
        const term = $('fileSearch').value.trim().toLowerCase()
        const matchesFile = (f) => !term || f.toLowerCase().includes(term)
        const children = buildChildren()

        function folderHasMatch(folderPath) {
          const kids = children[folderPath] || { folders: [], files: [] }
          return kids.files.some(matchesFile) || kids.folders.some(folderHasMatch)
        }

        function renderNode(parentPath, depth) {
          const kids = children[parentPath] || { folders: [], files: [] }
          const frag = document.createDocumentFragment()

          kids.folders.forEach((fp) => {
            if (term && !folderHasMatch(fp)) return
            const isOpen = term ? true : expanded.has(fp)
            const row = document.createElement('div')
            row.className = 'tree-row folder'
            row.style.paddingLeft = depth * 14 + 'px'

            const toggle = document.createElement('span')
            toggle.className = 'toggle'
            toggle.textContent = isOpen ? '▾' : '▸'

            const icon = document.createElement('span')
            icon.className = 'icon'
            icon.textContent = isOpen ? '📂' : '📁'

            const label = document.createElement('span')
            label.className = 'label folder-label'
            label.textContent = fp.split('/').pop()

            const openClose = () => {
              if (expanded.has(fp)) expanded.delete(fp)
              else expanded.add(fp)
              renderTree()
            }
            toggle.onclick = openClose
            icon.onclick = openClose
            label.onclick = openClose

            const menuBtn = document.createElement('button')
            menuBtn.className = 'icon-btn'
            menuBtn.textContent = '⋮'
            menuBtn.title = 'Folder actions'
            menuBtn.onclick = (e) => {
              e.stopPropagation()
              openContextMenu(menuBtn, [
                { label: '+ Add file', onClick: () => addFileToFolder(fp) },
                { label: '✎ Rename / Move', onClick: () => renameFolder(fp) },
                { label: '✕ Delete', danger: true, onClick: () => deleteFolder(fp) },
              ])
            }

            row.append(toggle, icon, label, menuBtn)
            frag.appendChild(row)
            if (isOpen) frag.appendChild(renderNode(fp, depth + 1))
          })

          kids.files.filter(matchesFile).forEach((fp) => {
            const row = document.createElement('div')
            row.className = 'tree-row file' + (fp === file ? ' active' : '')
            row.style.paddingLeft = depth * 14 + 14 + 'px'
            const icon = document.createElement('span')
            icon.className = 'icon'
            icon.textContent = '📄'
            const label = document.createElement('span')
            label.className = 'label'
            label.textContent = fp.split('/').pop()

            const menuBtn = document.createElement('button')
            menuBtn.className = 'icon-btn'
            menuBtn.textContent = '⋮'
            menuBtn.title = 'File actions'
            menuBtn.onclick = (e) => {
              e.stopPropagation()
              openContextMenu(menuBtn, [
                { label: '✎ Rename / Move', onClick: () => renameFile(fp) },
                { label: '✕ Delete', danger: true, onClick: () => deleteFile(fp) },
              ])
            }

            row.append(icon, label, menuBtn)
            row.onclick = () => openFile(fp)
            frag.appendChild(row)
          })

          return frag
        }

        const container = $('tree')
        container.innerHTML = ''
        const rendered = renderNode('', 0)
        if (!rendered.childNodes.length) {
          const p = document.createElement('p')
          p.className = 'muted'
          p.textContent = term ? '🔍 No files match' : 'No data files yet — create one below'
          container.appendChild(p)
        } else {
          container.appendChild(rendered)
        }
      }

      // Renders 'checkout/cases.json' as dimmed 'checkout /' + bold 'cases.json'.
      function renderCurrentPath(path) {
        const h2 = $('current')
        h2.innerHTML = ''
        const segments = path.split('/')
        const name = segments.pop()
        segments.forEach((seg) => {
          const dir = document.createElement('span')
          dir.className = 'seg-dir'
          dir.textContent = seg
          const sep = document.createElement('span')
          sep.className = 'seg-sep'
          sep.textContent = '/'
          h2.append(dir, sep)
        })
        h2.append(document.createTextNode(name))
      }

      $('fileSearch').oninput = renderTree

      async function renameFolder(fp) {
        const to = await showPrompt('Rename/move folder to:', fp)
        if (!to || to === fp) return
        try {
          await api('/api/entries', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: fp, to, type: 'folder' }),
          })
          expanded.delete(fp)
          expanded.add(to)
          if (file && (file === fp || file.startsWith(fp + '/'))) {
            file = to + file.slice(fp.length)
            renderCurrentPath(file)
          }
          toast('Renamed folder to ' + to)
          loadFiles()
        } catch (err) {
          toast(err.message, false)
        }
      }

      async function deleteFolder(fp) {
        if (!(await showConfirm(`Delete folder "${fp}"? (must be empty)`))) return
        try {
          await api('/api/folders/' + fp, { method: 'DELETE' })
          expanded.delete(fp)
          toast('Deleted folder ' + fp)
          loadFiles()
        } catch (err) {
          toast(err.message, false)
        }
      }

      async function addFileToFolder(folderPath) {
        const name = await showPrompt(`New file in ${folderPath}/ (name, .json optional):`)
        if (!name) return
        try {
          const { file: created } = await api('/api/files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: `${folderPath}/${name}` }),
          })
          expanded.add(folderPath)
          toast('Created ' + created)
          openFile(created)
        } catch (err) {
          toast(err.message, false)
        }
      }

      // Renames/moves any file — the one open in the editor or any other in the tree.
      async function renameFile(fp) {
        const to = await showPrompt('Rename/move file to (path relative to data/):', fp)
        if (!to || to === fp) return
        try {
          await api('/api/entries', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ from: fp, to, type: 'file' }),
          })
          toast('Renamed to ' + to)
          if (fp === file) {
            openFile(to)
          } else {
            loadFiles()
          }
        } catch (err) {
          toast(err.message, false)
        }
      }

      // Deletes any file — the one open in the editor or any other in the tree.
      async function deleteFile(fp) {
        if (!(await showConfirm('Delete ' + fp + '?'))) return
        try {
          await api('/api/data/' + fp, { method: 'DELETE' })
          toast('Deleted ' + fp)
          if (fp === file) {
            file = null
            records = []
            columns = []
            $('current').textContent = 'Select a file →'
            $('saveBtn').disabled = $('renameFileBtn').disabled = $('delFileBtn').disabled = true
            $('toolbar').hidden = true
            $('tableWrap').innerHTML = '<p class="muted">Pick a file on the left to edit it.</p>'
          }
          loadFiles()
        } catch (err) {
          toast(err.message, false)
        }
      }

      $('newFolderForm').onsubmit = async (e) => {
        e.preventDefault()
        const name = $('newFolderName').value.trim()
        if (!name) return
        try {
          await api('/api/folders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: name }),
          })
          $('newFolderName').value = ''
          expanded.add(name)
          toast('Created folder ' + name)
          loadFiles()
        } catch (err) {
          toast(err.message, false)
        }
      }

      function deriveSchema(rows) {
        columns = []
        types = {}
        columnFilters = {}
        rows.forEach((r) =>
          Object.keys(r).forEach((k) => {
            if (!columns.includes(k)) columns.push(k)
            if (!types[k] && r[k] !== '' && r[k] != null) types[k] = typeof r[k]
          }),
        )
        columns.forEach((c) => (types[c] ||= 'string'))
      }

      async function openFile(f) {
        $('tableWrap').innerHTML = '<p class="muted">Loading…</p>'
        const data = await api('/api/data/' + f)
        records = Array.isArray(data) ? data : [data]
        file = f
        dropdowns = await api('/api/dropdowns/' + f).catch(() => ({}))
        deriveSchema(records)
        renderCurrentPath(f)
        $('saveBtn').disabled = false
        $('renameFileBtn').disabled = false
        $('delFileBtn').disabled = false
        $('toolbar').hidden = false
        $('rowSearch').value = ''
        render()
        loadFiles()
      }

      // A configured dropdown column renders as a <select>. The current value is preserved
      // even if it's no longer in the option list (shown with a '(?)' suffix) so switching a
      // column to a dropdown never silently drops data that doesn't match.
      function dropdownCell(rec, col) {
        const sel = document.createElement('select')
        const cur = rec[col]
        const opts = dropdowns[col].map(String)
        const blank = document.createElement('option')
        blank.value = ''
        blank.textContent = '—'
        sel.appendChild(blank)
        if (cur !== '' && cur != null && !opts.includes(String(cur))) {
          const o = document.createElement('option')
          o.value = String(cur)
          o.textContent = String(cur) + ' (?)'
          sel.appendChild(o)
        }
        dropdowns[col].forEach((v) => {
          const o = document.createElement('option')
          o.value = String(v)
          o.textContent = String(v)
          sel.appendChild(o)
        })
        sel.value = cur == null ? '' : String(cur)
        sel.onchange = () => {
          const v = sel.value
          rec[col] = v !== '' && types[col] === 'number' ? Number(v) : v
        }
        return sel
      }

      function cellInput(rec, col) {
        const type = types[col]
        if (type !== 'boolean' && dropdowns[col]) return dropdownCell(rec, col)
        const inp = document.createElement('input')
        if (type === 'boolean') {
          inp.type = 'checkbox'
          inp.checked = !!rec[col]
          inp.onchange = () => (rec[col] = inp.checked)
        } else {
          inp.type = type === 'number' ? 'number' : 'text'
          inp.value = rec[col] ?? ''
          inp.oninput = () =>
            (rec[col] = type === 'number' && inp.value !== '' ? Number(inp.value) : inp.value)
        }
        return inp
      }

      function matchesRowSearch(rec, term) {
        if (!term) return true
        return columns.some((c) =>
          String(rec[c] ?? '')
            .toLowerCase()
            .includes(term),
        )
      }

      function matchesColumnFilters(rec) {
        return columns.every((c) => {
          const f = columnFilters[c]
          if (!f) return true
          if (types[c] === 'boolean') return String(!!rec[c]) === f
          return String(rec[c] ?? '')
            .toLowerCase()
            .includes(f.toLowerCase())
        })
      }

      // Distinct non-empty values for a column — used to offer a <select> filter when
      // there aren't too many of them; falls back to free-text filtering otherwise.
      function distinctValues(col) {
        const seen = new Set()
        records.forEach((r) => {
          if (r[col] !== '' && r[col] != null) seen.add(r[col])
        })
        return [...seen].sort()
      }

      function visibleRows() {
        const term = $('rowSearch').value.trim().toLowerCase()
        return records
          .map((rec, i) => ({ rec, i }))
          .filter(({ rec }) => matchesRowSearch(rec, term) && matchesColumnFilters(rec))
      }

      // Rebuilds only <tbody> — called on every search/filter change so the filter
      // controls in <thead> (esp. text inputs) never get destroyed mid-keystroke.
      function renderRows() {
        const tbody = document.querySelector('#tableWrap tbody')
        if (!tbody) return
        tbody.innerHTML = ''
        const visible = visibleRows()
        visible.forEach(({ rec, i }) => {
          const tr = document.createElement('tr')
          columns.forEach((c) => {
            const td = document.createElement('td')
            if (types[c] === 'boolean') td.className = 'center'
            td.appendChild(cellInput(rec, c))
            tr.appendChild(td)
          })
          const tdDel = document.createElement('td')
          tdDel.className = 'center'
          const del = document.createElement('button')
          del.textContent = '✕'
          del.className = 'danger'
          del.onclick = () => {
            records.splice(i, 1)
            render()
          }
          tdDel.appendChild(del)
          tr.appendChild(tdDel)
          tbody.appendChild(tr)
        })
        if (!visible.length) {
          const tr = document.createElement('tr')
          const td = document.createElement('td')
          td.colSpan = columns.length + 1
          td.className = 'muted'
          td.textContent = 'No rows match the current search/filter'
          tr.appendChild(td)
          tbody.appendChild(tr)
        }
      }

      function filterControl(col) {
        const current = columnFilters[col] ?? ''
        let control
        if (types[col] === 'boolean') {
          control = document.createElement('select')
          ;[
            ['', 'All'],
            ['true', 'true'],
            ['false', 'false'],
          ].forEach(([value, label]) => {
            const opt = document.createElement('option')
            opt.value = value
            opt.textContent = label
            control.appendChild(opt)
          })
        } else {
          const options = distinctValues(col)
          if (options.length && options.length <= 10) {
            control = document.createElement('select')
            const allOpt = document.createElement('option')
            allOpt.value = ''
            allOpt.textContent = 'All'
            control.appendChild(allOpt)
            options.forEach((v) => {
              const opt = document.createElement('option')
              opt.value = String(v)
              opt.textContent = String(v)
              control.appendChild(opt)
            })
          } else {
            control = document.createElement('input')
            control.type = 'text'
            control.placeholder = 'filter…'
          }
        }
        control.value = current
        const onChange = () => {
          columnFilters[col] = control.value
          renderRows()
        }
        if (control.tagName === 'SELECT') control.onchange = onChange
        else control.oninput = onChange
        return control
      }

      // Builds <table><thead>(headers + filter row)</thead><tbody></tbody></table> once
      // per schema/record-set change (open file, add/delete row, add field) — NOT on
      // every filter keystroke, see renderRows().
      function render() {
        const wrap = $('tableWrap')
        if (!columns.length) {
          wrap.innerHTML = '<p class="muted">Empty file — add a field, then a row.</p>'
          return
        }
        const table = document.createElement('table')

        const head = document.createElement('tr')
        columns.forEach((c) => {
          const th = document.createElement('th')
          const inner = document.createElement('div')
          inner.className = 'th-inner'
          const name = document.createElement('span')
          name.textContent = c
          inner.appendChild(name)
          // Boolean columns are checkboxes — a dropdown makes no sense there.
          if (types[c] !== 'boolean') {
            const ddBtn = document.createElement('button')
            ddBtn.className = 'icon-btn dd-btn' + (dropdowns[c] ? ' active' : '')
            ddBtn.textContent = '▾'
            ddBtn.title = dropdowns[c]
              ? `Dropdown: ${dropdowns[c].length} option(s)`
              : 'Make this column a dropdown'
            ddBtn.onclick = (e) => {
              e.stopPropagation()
              openDropdownManager(c)
            }
            inner.appendChild(ddBtn)
          }
          th.appendChild(inner)
          head.appendChild(th)
        })
        head.appendChild(document.createElement('th'))

        const filterRow = document.createElement('tr')
        filterRow.className = 'filter-row'
        columns.forEach((c) => {
          const td = document.createElement('td')
          td.appendChild(filterControl(c))
          filterRow.appendChild(td)
        })
        filterRow.appendChild(document.createElement('td'))

        const thead = document.createElement('thead')
        thead.append(head, filterRow)
        table.appendChild(thead)
        table.appendChild(document.createElement('tbody'))

        wrap.innerHTML = ''
        wrap.appendChild(table)
        renderRows()
      }

      $('addRowBtn').onclick = () => {
        const blank = {}
        columns.forEach(
          (c) => (blank[c] = types[c] === 'boolean' ? false : types[c] === 'number' ? 0 : ''),
        )
        records.push(blank)
        render()
      }

      $('rowSearch').oninput = renderRows

      $('addFieldForm').onsubmit = (e) => {
        e.preventDefault()
        const name = $('addFieldName').value.trim()
        if (!name || columns.includes(name)) return
        columns.push(name)
        types[name] = 'string'
        records.forEach((r) => (r[name] ??= ''))
        $('addFieldName').value = ''
        render()
      }

      $('saveBtn').onclick = async () => {
        try {
          await api('/api/data/' + file, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(records),
          })
          toast('Saved ' + file)
        } catch (err) {
          toast(err.message, false)
        }
      }

      $('renameFileBtn').onclick = () => renameFile(file)
      $('delFileBtn').onclick = () => deleteFile(file)

      $('newFileForm').onsubmit = async (e) => {
        e.preventDefault()
        const name = $('newFileName').value.trim()
        if (!name) return
        try {
          const { file: created } = await api('/api/files', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
          })
          $('newFileName').value = ''
          toast('Created ' + created)
          openFile(created)
        } catch (err) {
          toast(err.message, false)
        }
      }

      // ── Dropdown manager ─────────────────────────────────────────────────────
      // Options are edited on a working copy (ddOpts); nothing is written to the
      // server until Save/Remove, keeping Cancel truly non-destructive.
      let ddCol = null
      let ddOpts = []

      const persistDropdowns = () =>
        api('/api/dropdowns/' + file, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dropdowns),
        })

      function renderDdList() {
        const list = $('ddList')
        list.innerHTML = ''
        if (!ddOpts.length) {
          const p = document.createElement('p')
          p.className = 'muted'
          p.textContent = 'No options yet — add one below.'
          list.appendChild(p)
          return
        }
        ddOpts.forEach((opt, i) => {
          const row = document.createElement('div')
          row.className = 'dd-row'
          const inp = document.createElement('input')
          inp.type = 'text'
          inp.value = opt
          inp.oninput = () => (ddOpts[i] = inp.value)
          const del = document.createElement('button')
          del.className = 'icon-btn danger'
          del.textContent = '✕'
          del.title = 'Remove option'
          del.onclick = () => {
            ddOpts.splice(i, 1)
            renderDdList()
          }
          row.append(inp, del)
          list.appendChild(row)
        })
      }

      function openDropdownManager(col) {
        ddCol = col
        ddOpts = [...(dropdowns[col] || [])]
        $('ddTitle').textContent = 'Dropdown — ' + col
        $('ddAddInput').value = ''
        $('ddRemove').hidden = !dropdowns[col]
        renderDdList()
        $('ddOverlay').hidden = false
        $('ddAddInput').focus()
      }

      const closeDropdownManager = () => ($('ddOverlay').hidden = true)

      $('ddAddForm').onsubmit = (e) => {
        e.preventDefault()
        const v = $('ddAddInput').value.trim()
        if (v && !ddOpts.includes(v)) ddOpts.push(v)
        $('ddAddInput').value = ''
        renderDdList()
        $('ddAddInput').focus()
      }

      $('ddSave').onclick = async () => {
        const clean = [...new Set(ddOpts.map((o) => String(o).trim()).filter(Boolean))]
        if (clean.length) dropdowns[ddCol] = clean
        else delete dropdowns[ddCol]
        try {
          await persistDropdowns()
          closeDropdownManager()
          render()
          toast(clean.length ? 'Dropdown saved for ' + ddCol : 'Dropdown removed from ' + ddCol)
        } catch (err) {
          toast(err.message, false)
        }
      }

      $('ddRemove').onclick = async () => {
        delete dropdowns[ddCol]
        try {
          await persistDropdowns()
          closeDropdownManager()
          render()
          toast('Dropdown removed from ' + ddCol)
        } catch (err) {
          toast(err.message, false)
        }
      }

      $('ddCancel').onclick = closeDropdownManager
      $('ddOverlay').onclick = (e) => {
        if (e.target === $('ddOverlay')) closeDropdownManager()
      }
      $('ddOverlay').onkeydown = (e) => {
        if (e.key === 'Escape') closeDropdownManager()
      }

      loadFiles()
    </script>
  </body>
</html>
